name: FE CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - name: Build frontend
        run: npm run build
        env:
          LOCAL_PAGES_BUILD: "1"
          NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
      - run: npm run typecheck --if-present

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && vars.LOCAL_PAGES_DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -s out/index.html || { echo "::error::Missing Pages static export"; exit 1; }
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          # Cloudflare uses this label for its existing production environment.
          npx --yes wrangler@4.125.0 pages deploy out \
            --project-name local-odyssey \
            --branch feat/mobile-first-ui \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false
