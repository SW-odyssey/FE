name: FE CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build frontend
        run: npm run build
        env:
          LOCAL_PAGES_BUILD: "1"
          NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
      - run: npm run typecheck
      - name: Verify Pages output
        run: test -s out/index.html && test -s out/manifest.webmanifest
      - name: Save verified Pages output
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-pages
          path: out/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy Local to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: local-production
      url: https://local.hrxlou.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: local-pages
          path: out/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/local-wrangler" --no-save --no-audit --no-fund wrangler@4.125.0
      - name: Publish verified output
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing local-production account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Missing local-production Pages token}"
          # The Direct Upload project uses this production label for the custom domain.
          "$RUNNER_TEMP/local-wrangler/node_modules/.bin/wrangler" pages deploy out \
            --project-name local-odyssey \
            --branch feat/mobile-first-ui \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false
